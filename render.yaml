# Render Blueprint — backend + agent for the Cyber Intel Marketplace.
# Deploy: push this file, then in Render → "New +" → "Blueprint" → pick this repo.
# Fill secret values (marked sync: false) in the Render dashboard after creation.
#
# Node 22+ is required: the backend uses the built-in node:sqlite module.
services:
  # ---------------------------------------------------------------------------
  # Backend API (Fastify + node:sqlite). Long-running, stateful.
  # NOTE: free tier has no persistent disk — the SQLite registry lives on the
  # ephemeral filesystem and resets on restart/redeploy. seedServices() re-seeds
  # the marketplace at startup, but provider/agent registrations won't persist.
  # ---------------------------------------------------------------------------
  - type: web
    name: cim-backend
    runtime: node
    plan: free               # free tier sleeps after ~15m idle (30-60s cold start).
                             # Keep the service warm with an uptime pinger on /health
                             # if you need instant responses during judging.
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # PORT is injected by Render automatically; index.ts reads process.env.PORT.
      - key: HEDERA_NETWORK
        value: testnet
      - key: BLOCKY402_URL
        value: https://api.testnet.blocky402.com
      - key: WORLD_ENVIRONMENT
        value: staging
      - key: WORLD_ACTION
        value: publish-service
      - key: REQUIRE_AGENT_BACKING
        value: "false"
      # ---- secrets: set these in the Render dashboard, not in git ----
      - key: HEDERA_ACCOUNT_ID
        sync: false
      - key: HEDERA_PRIVATE_KEY
        sync: false
      - key: HEDERA_RECIPIENT
        sync: false
      - key: AGENT_ACCOUNT_ID
        sync: false
      - key: WORLD_APP_ID
        sync: false
      - key: WORLD_RP_ID
        sync: false
      - key: RP_SIGNING_KEY
        sync: false
      # optional threat-intel API keys (mock data used if unset)
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Agent event-stream service (SSE). Runs the investigation loop once at start,
  # then keeps the /events stream alive. Serves /health on $PORT.
  # ---------------------------------------------------------------------------
  - type: web
    name: cim-agent
    runtime: node
    plan: free
    rootDir: agent
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The agent's SSE server listens on EVENT_STREAM_PORT — map it to Render's PORT.
      - key: EVENT_STREAM_PORT
        fromService:
          type: web
          name: cim-agent
          property: port
      - key: HEDERA_NETWORK
        value: testnet
      - key: BLOCKY402_URL
        value: https://api.testnet.blocky402.com
      - key: MAX_SPEND_HBAR
        value: "1.0"
      - key: PAYMENT_MODE
        value: stub            # set to "real" once the agent account is funded
      # Point the agent at the backend service (internal Render URL).
      - key: BACKEND_URL
        fromService:
          type: web
          name: cim-backend
          property: hostport
      # ---- secrets: set in the Render dashboard ----
      - key: HEDERA_ACCOUNT_ID
        sync: false
      - key: HEDERA_PRIVATE_KEY
        sync: false
      - key: WORLD_PROOF
        sync: false
