openapi: 3.0.3
info:
  title: Cyber Intel Marketplace API
  version: 0.1.0
  description: >
    Threat-intelligence services for autonomous agents. Query IP reputation and
    file-hash reputation, or submit a batch of indicators to be scored and
    stack-ranked worst-first. Intel-serving endpoints are metered per query and
    settled via x402 (HTTP 402 Payment Required) on Hedera.
servers:
  - url: http://localhost:3001
    description: Local development
  # Replace with your public/tunnel URL when registering the Bazantic gateway.
  # - url: https://your-public-host
  #   description: Public deployment consumed by the Bazantic gateway

paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: cyber-intel-backend }

  /marketplace/services:
    get:
      operationId: listServices
      summary: Discover available intel services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }

  /api/ip-reputation:
    get:
      operationId: ipReputation
      summary: Look up the reputation of an IP address (metered, x402-gated)
      parameters:
        - name: ip
          in: query
          required: true
          schema: { type: string }
          example: "45.83.12.9"
      responses:
        "200":
          description: IP reputation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpReputationResult" }
        "402":
          description: Payment required (x402)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequiredResponse" }
        "400":
          description: Missing or invalid parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/hash-check:
    get:
      operationId: hashCheck
      summary: Check a file hash against malware databases (metered, x402-gated)
      parameters:
        - name: hash
          in: query
          required: true
          schema: { type: string }
          example: "44d88612fea8a8f36de82e1278abb02f"
      responses:
        "200":
          description: Hash check result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HashCheckResult" }
        "402":
          description: Payment required (x402)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequiredResponse" }
        "400":
          description: Missing or invalid parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/triage:
    post:
      operationId: triage
      summary: Score and stack-rank a batch of indicators, worst-first
      description: >
        Accepts a mixed list of IPs and file hashes, queries the matching intel
        provider for each, normalizes to a single 0-100 threat score, and
        returns them sorted worst-first with a count of malicious hits. This is
        the primary operation intended for agent recipes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageRequest" }
            example:
              indicators:
                - "45.83.12.9"
                - "8.8.8.8"
                - "44d88612fea8a8f36de82e1278abb02f"
      responses:
        "200":
          description: Ranked triage result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageResponse" }
        "400":
          description: Missing or invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

components:
  schemas:
    Service:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        endpoint: { type: string }
        queryType: { type: string, enum: [ip, hash] }
        priceHbar: { type: number }
        providerId: { type: string }
        createdAt: { type: string, format: date-time }

    IpReputationResult:
      type: object
      properties:
        ip: { type: string }
        malicious: { type: boolean }
        score: { type: integer, minimum: 0, maximum: 100 }
        source: { type: string, example: abuseipdb }

    HashCheckResult:
      type: object
      properties:
        hash: { type: string }
        detections: { type: integer }
        verdict: { type: string, enum: [malicious, suspicious, clean] }
        source: { type: string, example: virustotal }

    TriageRequest:
      type: object
      required: [indicators]
      properties:
        indicators:
          type: array
          minItems: 1
          items: { type: string }

    TriageItem:
      type: object
      properties:
        indicator: { type: string }
        queryType: { type: string, enum: [ip, hash] }
        score: { type: integer, minimum: 0, maximum: 100 }
        malicious: { type: boolean }
        detail:
          oneOf:
            - { $ref: "#/components/schemas/IpReputationResult" }
            - { $ref: "#/components/schemas/HashCheckResult" }

    TriageResponse:
      type: object
      properties:
        ranked:
          type: array
          items: { $ref: "#/components/schemas/TriageItem" }
        count: { type: integer }
        maliciousCount: { type: integer }

    PaymentRequiredResponse:
      type: object
      properties:
        error: { type: string, example: payment_required }
        payment:
          type: object
          properties:
            amountHbar: { type: number }
            recipient: { type: string }
            facilitator: { type: string, example: blocky402 }
            requestId: { type: string }
            resource: { type: string }

    ApiError:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
